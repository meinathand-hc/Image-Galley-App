version: 0.0
os: linux

file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /home/django/image_gallery_app

hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/restart_app.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_app.sh
      timeout: 60
      runas: root
